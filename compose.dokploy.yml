services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: callus
      POSTGRES_USER: callus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callus -d callus"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://callus:${POSTGRES_PASSWORD}@postgres:5432/callus
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: postgresql://callus:${POSTGRES_PASSWORD}@postgres:5432/callus
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in Dokploy}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in Dokploy}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in Dokploy}
      POWERSYNC_URL: ${POWERSYNC_URL:?Set POWERSYNC_URL in Dokploy}
      NODE_ENV: production
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
